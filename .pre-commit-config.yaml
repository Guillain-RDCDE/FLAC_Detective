# Pre-commit hooks configuration for FLAC Detective
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# ruff and mypy are pinned to the SAME versions as the `dev` extra in
# pyproject.toml, which is what the CI's "Code Quality Checks" job installs, and
# every hook reads its settings from pyproject.toml. A hook that formats with a
# different version than the gate is a second opinion, not a pre-check: it
# rewrites code the gate then rejects. When a pin moves there, it moves here in
# the same commit.

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict

      # Prevent giant files from being committed
      - id: check-added-large-files
        args: ['--maxkb=1000']

      # Check for merge conflicts
      - id: check-merge-conflict

      # Check YAML syntax
      - id: check-yaml
        exclude: ^\.pre-commit-config\.yaml$

      # Check TOML syntax
      - id: check-toml

      # Check JSON syntax
      - id: check-json

      # Ensure files end with a newline
      - id: end-of-file-fixer
        exclude: '^tests/test_data/'

      # Remove trailing whitespace
      - id: trailing-whitespace
        exclude: '^tests/test_data/'

      # Check that Python files are valid syntax
      - id: check-ast

      # Check for debugger imports
      - id: debug-statements

      # Detect private keys
      - id: detect-private-key

      # Fix mixed line endings
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Lint and format with ruff (pinned as in pyproject [dev])
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Type checking with mypy (pinned as in pyproject [dev]); its scope,
  # `files = ["src"]`, comes from pyproject.toml, as in CI.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        pass_filenames: false
        # The libraries CI type-checks against. numpy is held below 2.5 because
        # CI's mypy job runs on Python 3.11, where numpy stops at 2.4; the 2.5
        # stubs reject `.max()`/`.min()` calls that CI accepts.
        additional_dependencies: [
          'types-setuptools',
          'numpy<2.5',
          'scipy',
          'soundfile',
          'mutagen',
          'rich',
        ]


# Global configuration
default_language_version:
  python: python3

# Files to exclude from all hooks.
#
# ml/ is the research corpus and the exchange evidence, hashed as bytes, some of
# it with published SHA-256 (see .gitattributes): a hook that fixes a line ending
# or strips a trailing space there changes a hash a third party already holds.
# No hook touches any of it.
exclude: |
  (?x)^(
    \.git/|
    \.venv/|
    build/|
    dist/|
    \.eggs/|
    .*\.egg-info/|
    __pycache__/|
    .*\.pyc$|
    \.mypy_cache/|
    \.pytest_cache/|
    \.coverage|
    htmlcov/|
    tests/test_data/|
    ml/
  )

# Run hooks in parallel for speed
fail_fast: false
