[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flac-detective"
# The version is written once, in src/flac_detective/__version__.py, and read
# from there at build time (see [tool.setuptools.dynamic]). The release workflow
# checks the tag against that file, against [tool.commitizen].version and against
# the version of the wheel it actually built.
dynamic = ["version"]
description = "Advanced FLAC authenticity analyzer - Detects MP3-to-FLAC transcodes with high precision"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Guillain d'Erceville", email = "guillain@poulpe.us"}
]
keywords = ["flac", "audio", "analysis", "transcode", "detection", "mp3", "quality", "authenticity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Utilities",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "mutagen>=1.45.0",
    "soundfile>=0.10.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "librosa>=0.10",
]
beets = [
    "beets>=1.6.0",
]
gui = [
    "PySide6>=6.5",
    "matplotlib>=3.6",
]
dev = [
    "beets>=1.6.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    # The gating linters are PINNED, not floated. On 2026-08-30 the CI had been
    # red for two days on a file nobody had touched: `pip install -e ".[dev]"`
    # picked up isort 9.0.1 where the last green run had 8.0.1, and 9 collapses a
    # single-name parenthesised import that 8 left alone. A linter installed by
    # range is not a gate, it is a weather report - and the local run passed only
    # because isort could not read the files at all under the Windows console
    # encoding (run the gates with PYTHONUTF8=1). Raising a pin is a deliberate
    # change, with its cleanup in the same commit.
    # ruff and mypy carry the same versions in .pre-commit-config.yaml: they
    # move together, in the same commit.
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pre-commit>=3.5.0",
    "commitizen>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "myst-parser>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Guillain-RDCDE/FLAC_Detective"
Repository = "https://github.com/Guillain-RDCDE/FLAC_Detective"
Documentation = "https://guillain-rdcde.github.io/FLAC_Detective/"
Changelog = "https://github.com/Guillain-RDCDE/FLAC_Detective/blob/main/CHANGELOG.md"
Issues = "https://github.com/Guillain-RDCDE/FLAC_Detective/issues"

[project.scripts]
flac-detective = "flac_detective.main:main"

[project.gui-scripts]
flac-detective-gui = "flac_detective.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "flac_detective.__version__.__version__"}

[tool.setuptools.package-data]
"flac_detective.gui" = ["resources/*.png", "resources/*.ico"]

[tool.ruff]
# ruff is the only linter and formatter: it replaces black, isort, flake8 (and
# its docstring, bugbear and comprehensions plugins), pylint and bandit. The
# target version is read from `requires-python`.
line-length = 100
# ml/ is the research corpus and the blind-exchange evidence: hashed as bytes,
# never reformatted, never linted.
extend-exclude = ["ml", "tests/test_data"]
# Also when pre-commit passes those files by name.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting (was isort)
    "UP",   # modern syntax for the target version
    "B",    # bugbear
    "SIM",  # simplifications
    "RUF",  # ruff's own rules
    "S",    # security (was bandit)
    "C90",  # cyclomatic complexity (was flake8's mccabe)
]
ignore = [
    # Line length is the formatter's job; flake8 had E501 off for the same
    # reason. What the formatter cannot wrap is long strings and comments.
    "E501",
    # Running flac, ffmpeg and our own interpreter is what this tool does: the
    # executables are looked up on PATH and the arguments are built here, never
    # taken from a shell. bandit's gate (-ll) left these low-severity findings
    # out for the same reason.
    "S603",
    "S607",
]
# Typography in docstrings and comments, on purpose: en dash for ranges, the
# multiplication and minus signs in measurements, the information sign in output.
allowed-confusables = ["–", "×", "−", "ℹ"]
# Codes of rules this configuration does not select, kept in `# noqa` comments
# because the comment documents a deliberate choice (BLE001: a blind except that
# must never let a side check break an analysis).
external = ["BLE001"]

[tool.ruff.lint.mccabe]
# Same bound as flake8 had. The functions above it carry a targeted
# `# noqa: C901`, so only new violations fail.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# assert is pytest's tool.
"tests/**" = ["S101"]

[tool.mypy]
# Scope and options live here only: CI and the pre-commit hook run bare `mypy`.
files = ["src"]
# Match the project's actual minimum (3.10+). On "3.9" mypy parsed torch's
# match statements with a 3.9 target and crashed before ever reaching src/,
# so it silently checked nothing. src/ is now type-clean and mypy is a hard
# gate in the Code Quality Checks CI job.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "mutagen.*",
    "soundfile.*",
    "scipy.*",
    "beets.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Coverage is NOT switched on here: the CI's coverage step passes the
    # `--cov*` flags itself, and a plain local `pytest` run used to write
    # htmlcov/ and coverage.xml into the (synchronised) working tree on every
    # invocation — see [tool.coverage.run] for what that cost on Windows.
    # NOTE: --cov-fail-under intentionally not set. Current coverage (~30%)
    # reflects that CLI/repair/reporter modules are tested by manual usage
    # rather than unit tests. Raising it would either require gating release
    # on coverage we can't realistically reach or omit half the codebase.
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
# If pytest ends in `INTERNALERROR> PermissionError: [WinError 32] ... .coverage.*`
# with every test passing above it, nothing is wrong with the tests. Coverage is
# deleting its own data file and something else is holding it open — on Windows
# that something is usually a file-sync client, and this repository lives inside
# one. The run is not a green gate whatever the count above it says.
#
# Fix locally by putting the data file outside the synced tree before running:
#   $env:COVERAGE_FILE = "$env:TEMP\fd-coverage\.coverage"   (PowerShell)
#   export COVERAGE_FILE=/tmp/fd-coverage/.coverage          (bash)
#
# Not set here on purpose: CI runs on Linux with no sync layer, has never seen
# this, and writes its data file where the coverage upload step expects it.
# Diagnosed 2 September 2026, after first being blamed — wrongly — on two heavy
# jobs running at once.
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.commitizen]
name = "cz_conventional_commits"
# Commitizen's own record of the current version (its default provider). A bump
# rewrites it and the one source file below; the release workflow refuses a tag
# that does not match both.
version = "2.5.0"
tag_format = "v$version"
update_changelog_on_bump = false
version_files = [
    "src/flac_detective/__version__.py:__version__"
]
bump_message = "bump: version $current_version → $new_version"
major_version_zero = false
