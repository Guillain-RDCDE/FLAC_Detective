# Pre-commit hooks configuration for FLAC Detective
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# The Python hooks are pinned to the SAME versions as the `dev` extra in
# pyproject.toml, which is what the CI's "Code Quality Checks" job installs. A
# hook that formats with a different black or isort than the gate is a second
# opinion, not a pre-check: it rewrites code the gate then rejects. When a pin
# moves there, it moves here in the same commit.

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict

      # Prevent giant files from being committed
      - id: check-added-large-files
        args: ['--maxkb=1000']

      # Check for merge conflicts
      - id: check-merge-conflict

      # Check YAML syntax
      - id: check-yaml
        exclude: ^\.pre-commit-config\.yaml$

      # Check TOML syntax
      - id: check-toml

      # Check JSON syntax
      - id: check-json

      # Ensure files end with a newline
      - id: end-of-file-fixer
        exclude: '^tests/test_data/'

      # Remove trailing whitespace
      - id: trailing-whitespace
        exclude: '^tests/test_data/'

      # Check that Python files are valid syntax
      - id: check-ast

      # Check for debugger imports
      - id: debug-statements

      # Detect private keys
      - id: detect-private-key

      # Fix mixed line endings
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting with Black (pinned as in pyproject [dev])
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3
        args: ['--config=pyproject.toml']

  # Python import sorting with isort (pinned as in pyproject [dev])
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: ['--settings-path=pyproject.toml']

  # Python linting with flake8: the configuration is `.flake8`, the same file the
  # CI reads, so the hook and the gate agree on complexity, ignores and excludes.
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies: [
          'flake8-docstrings==1.7.0',
          'flake8-bugbear==25.11.29',
          'flake8-comprehensions==3.17.0',
        ]

  # Python type checking with mypy (pinned as in pyproject [dev])
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: ['--config-file=pyproject.toml']
        additional_dependencies: [
          'types-setuptools',
          'numpy',
          'scipy'
        ]
        exclude: '^tests/'

  # Security checks with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        # pass_filenames: false — bandit scans `src` recursively via `-r`; without this,
        # pre-commit also appends the staged file list, which bandit rejects with
        # "error: unrecognized arguments: <files>" (it can't take both -r and targets).
        pass_filenames: false
        args: [
          '-r', 'src',
          '-ll',                   # gate on medium+ severity (matches the CI bandit step);
                                   # the Low subprocess/PATH findings are intentional (flac/ffmpeg)
          '--skip', 'B101,B601',  # assert_used, paramiko shell — not relevant here
          '--exclude', 'tests'
        ]


# Global configuration
default_language_version:
  python: python3

# Files to exclude from all hooks.
#
# The exchange evidence under ml/ is hashed as bytes and its SHA-256 has been
# published (see .gitattributes): a hook that fixes a line ending or strips a
# trailing space there changes a hash a third party already holds.
exclude: |
  (?x)^(
    \.git/|
    \.venv/|
    build/|
    dist/|
    \.eggs/|
    .*\.egg-info/|
    __pycache__/|
    .*\.pyc$|
    \.mypy_cache/|
    \.pytest_cache/|
    \.coverage|
    htmlcov/|
    tests/test_data/|
    ml/exchange/received/|
    ml/exchange/MANIFEST.*\.sha256$|
    ml/verdicts_set.*\.csv$
  )

# Run hooks in parallel for speed
fail_fast: false
