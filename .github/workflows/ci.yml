name: FLAC Detective CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every supported version on Linux; the oldest and newest on Windows, the
        # newest on macOS. The suite has no per-version branches, so the full
        # OS x version product only repeated the same run nine times.
        # Linux 3.12 is the reference leg: it runs everything, slow tests
        # included, once, under coverage. Every other leg skips the slow set.
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12", coverage: true }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.14" }

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # flac CLI enables the end-to-end lossless-repair proof (test_repair_lossless.py)
        sudo apt-get install -y libsndfile1 flac

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install libsndfile flac

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        # libsndfile is bundled with the soundfile wheel; the flac CLI is optional
        # here — test_repair_lossless.py skips itself if `flac` isn't on PATH.
        echo "No additional dependencies needed"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Skipped everywhere:
    #   - tests/integration/  — manual scripts that hash & copy real FLAC
    #     files from external drives. No CI fixtures, not meant to run
    #     unattended.
    #   - tests/benchmarks/  — performance benchmarks (pytest-benchmark), run
    #     locally with `pytest tests/benchmarks/`; gating every push on perf
    #     measurements is not the intent.
    - name: Test with pytest (slow tests skipped)
      if: ${{ !matrix.coverage }}
      run: |
        pytest tests/ --ignore=tests/integration --ignore=tests/benchmarks -m "not slow" --tb=short

    - name: Test with pytest, slow tests included, under coverage
      if: ${{ matrix.coverage }}
      run: |
        pytest tests/ --ignore=tests/integration --ignore=tests/benchmarks --tb=short --cov=flac_detective --cov-report=xml --cov-report=term-missing --cov-report=html

    - name: Upload coverage to Codecov
      if: ${{ matrix.coverage }}
      continue-on-error: true
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-ubuntu-py312
        fail_ci_if_error: false
        verbose: true
        # Note: For public repos, you may need to set up Codecov GitHub App
        # or add CODECOV_TOKEN secret. See: https://docs.codecov.com/docs/quick-start

    - name: Archive coverage HTML report
      if: ${{ matrix.coverage }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-html
        path: htmlcov/
        retention-days: 30

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # This job ("Code Quality Checks") is a required status check on main.
    # ruff is the only linter and formatter, pinned in the `dev` extra and in
    # .pre-commit-config.yaml; every tool reads its scope and rules from
    # pyproject.toml, so the same bare commands run locally check the same thing.
    - name: Lint with ruff
      run: |
        ruff check --output-format=github

    - name: Check formatting with ruff
      run: |
        ruff format --check

    # mypy is a hard gate too — src/ is type-clean (checked against py3.10).
    - name: Type check with mypy
      run: |
        mypy

  wheel-smoke-test:
    name: Wheel install smoke test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install libsndfile

    - name: Build wheel and sdist
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel --sdist

    # Smoke test: install the built artifacts in clean venvs and exercise the
    # public surface from outside the source tree. Catches packaging-time bugs
    # that pytest (which runs against the editable source layout) cannot,
    # notably circular imports that surface only when the package is loaded
    # from site-packages. See issue #7.
    - name: Smoke-test wheel install (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euxo pipefail
        python -m venv /tmp/smoke-wheel
        /tmp/smoke-wheel/bin/pip install --upgrade pip
        /tmp/smoke-wheel/bin/pip install dist/*.whl
        # Move out of the source tree so the install — not the local `src/` —
        # is what gets exercised.
        cd /tmp
        /tmp/smoke-wheel/bin/python -c "import flac_detective; print('import OK, version', flac_detective.__version__)"
        /tmp/smoke-wheel/bin/python -c "from flac_detective.main import main; print('main import OK')"
        /tmp/smoke-wheel/bin/flac-detective --version

    - name: Smoke-test sdist install (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euxo pipefail
        python -m venv /tmp/smoke-sdist
        /tmp/smoke-sdist/bin/pip install --upgrade pip
        /tmp/smoke-sdist/bin/pip install dist/*.tar.gz
        cd /tmp
        /tmp/smoke-sdist/bin/python -c "import flac_detective; print('import OK, version', flac_detective.__version__)"
        /tmp/smoke-sdist/bin/flac-detective --version

    - name: Smoke-test wheel install (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        python -m venv $env:RUNNER_TEMP\smoke-wheel
        & "$env:RUNNER_TEMP\smoke-wheel\Scripts\pip.exe" install --upgrade pip
        $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
        & "$env:RUNNER_TEMP\smoke-wheel\Scripts\pip.exe" install $wheel.FullName
        Push-Location $env:RUNNER_TEMP
        & "$env:RUNNER_TEMP\smoke-wheel\Scripts\python.exe" -c "import flac_detective; print('import OK, version', flac_detective.__version__)"
        & "$env:RUNNER_TEMP\smoke-wheel\Scripts\python.exe" -c "from flac_detective.main import main; print('main import OK')"
        & "$env:RUNNER_TEMP\smoke-wheel\Scripts\flac-detective.exe" --version
        Pop-Location

    # The case that catches the bug nobody sees: a STOCK Windows console.
    #
    # 1.13.0 shipped to PyPI unable to start on cp1252 — the banner printed
    # before argument parsing contains box-drawing glyphs with no cp1252
    # mapping, so flac-detective died with UnicodeEncodeError before parsing a
    # single argument. Every job above passed, because GitHub runners default
    # their console to UTF-8. It was reported by a user, not by CI.
    #
    # chcp 1252 puts the console where a real user's is, and PYTHONIOENCODING is
    # deliberately cleared: the point is the default.
    - name: Smoke-test on a cp1252 console (the stock Windows case)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        chcp 1252 | Out-Null
        $env:PYTHONIOENCODING = ""
        & "$env:RUNNER_TEMP\smoke-wheel\Scripts\flac-detective.exe" --version
        if ($LASTEXITCODE -ne 0) { throw "--version failed on a cp1252 console" }
        & "$env:RUNNER_TEMP\smoke-wheel\Scripts\flac-detective.exe" --help | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "--help failed on a cp1252 console" }
        Write-Host "cp1252 console OK"
