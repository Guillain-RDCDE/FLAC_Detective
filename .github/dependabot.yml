# Dependabot configuration for FLAC Detective
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    assignees:
      - "Guillain-RDCDE"
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: "scope"
    # Group updates for related dependencies
    groups:
      # Scientific computing libraries
      scientific:
        patterns:
          - "numpy"
          - "scipy"
      # Audio libraries
      audio:
        patterns:
          - "mutagen"
          - "soundfile"
      # Development tools
      development:
        patterns:
          - "pytest*"
          - "black"
          - "isort"
          - "flake8*"
          - "mypy"
          - "pylint"
          - "bandit"
          - "pre-commit"
      # Documentation
      documentation:
        patterns:
          - "sphinx*"
          - "myst-parser"
    # This is a library: its runtime requirements are LOWER BOUNDS
    # (numpy>=1.20.0, ...). `increase` would raise them on every release of
    # a dependency and shut out users on older but perfectly compatible
    # versions. `increase-if-necessary` only moves a bound when the new
    # version no longer satisfies it. The exact pins of the gating linters
    # in the `dev` extra are deliberate and move by hand (see pyproject).
    versioning-strategy: increase-if-necessary
    # Allow automatic rebasing when target branch updates
    rebase-strategy: auto

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "Guillain-RDCDE"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Group all GitHub Actions updates
    groups:
      github-actions:
        patterns:
          - "*"
    # Allow automatic rebasing when target branch updates
    rebase-strategy: auto
